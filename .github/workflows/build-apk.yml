
name: Build Lifx VPN APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Check project files
        shell: bash
        run: |
          echo "Memeriksa struktur project..."
          ls -la

          if [ ! -f settings.gradle ] &&
             [ ! -f settings.gradle.kts ] &&
             [ ! -f build.gradle ] &&
             [ ! -f build.gradle.kts ]; then
            echo "ERROR: Konfigurasi Gradle tidak ditemukan."
            echo "Periksa apakah project Android berada di subfolder."
            exit 1
          fi

      - name: Accept Android SDK licenses
        shell: bash
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" \
            -type f -name sdkmanager | head -n 1)"

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: Android SDK sdkmanager tidak ditemukan."
            exit 1
          fi

          for i in $(seq 1 100); do
            echo y
          done > /tmp/licenses.txt

          "$SDKMANAGER" --licenses < /tmp/licenses.txt

      - name: Install Android SDK
        shell: bash
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" \
            -type f -name sdkmanager | head -n 1)"

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Build Debug APK
        shell: bash
        run: |
          gradle --no-daemon assembleDebug

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: LifxVPN-debug-apk
          path: "**/build/outputs/apk/debug/*.apk"
          if-no-files-found: error
          retention-days: 14
